
services:
  mysql:
    image: mysql:8.0
    container_name: cloudvault-mysql
    restart: always
    environment:
      MYSQL_DATABASE: cloudvault_db
      MYSQL_USER: cloudvault_user
      MYSQL_PASSWORD: cloudvault_secure_password
      MYSQL_ROOT_PASSWORD: cloudvault_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cloudvault-backend
    restart: always
    environment:
      PORT: 5000
      JWT_SECRET: cloudvault_super_secret_key_9988
      DB_HOST: mysql
      DB_USER: cloudvault_user
      DB_PASSWORD: cloudvault_secure_password
      DB_NAME: cloudvault_db
      DB_PORT: 3306
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: cloudvault-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
